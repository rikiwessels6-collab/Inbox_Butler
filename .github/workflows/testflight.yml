# Builds a signed release and uploads it to TestFlight. Run it by hand:
# GitHub > Actions > TestFlight > Run workflow.
# One-time setup (Apple account, API key, 4 secrets): docs/TESTFLIGHT.md
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      include_widget:
        description: "Include the widget (needs the App Group set up in the Apple Developer portal). Leave off for the first build."
        type: boolean
        default: false

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are set
        run: |
          missing=""
          [ -z "$ASC_KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$ASC_KEY_P8" ] && missing="$missing ASC_KEY_P8"
          [ -z "$TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing. See docs/TESTFLIGHT.md step 5."
            exit 1
          fi
          if grep -q "YOUR_IOS_CLIENT_ID" InboxButler/Support/AppConfig.swift; then
            echo "::warning::Google client ID not set in AppConfig.swift: Gmail sign-in won't work in this build (see docs/SETUP_GOOGLE.md)."
          fi

      - name: Basic build (no widget, no App Group)
        if: ${{ !inputs.include_widget }}
        run: |
          pip3 install --quiet pyyaml || pip3 install --quiet --break-system-packages pyyaml
          python3 scripts/make_basic_project.py

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Save App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive (unsigned; Apple signs it at export)
        # Signing here would need a development profile, which needs a registered test device.
        # TestFlight only needs the distribution signature added at export, below.
        run: |
          xcodebuild archive \
            -project InboxButler.xcodeproj \
            -scheme InboxButler \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/InboxButler.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" > archive.log 2>&1 && status=0 || status=$?
          echo "---- errors ----"; grep -E "error:" archive.log | sort -u | head -40
          echo "---- tail ----"; tail -n 15 archive.log
          exit $status

      - name: Export and upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/InboxButler.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > export.log 2>&1 && status=0 || status=$?
          echo "---- errors ----"; grep -iE "error|invalid|denied" export.log | sort -u | head -40
          echo "---- tail ----"; tail -n 25 export.log
          exit $status

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
