# Builds and tests on a real Mac in the cloud. No signing, no secrets needed.
name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  core-tests:
    name: Core tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Run InboxButlerCore tests
        working-directory: InboxButlerCore
        run: swift test 2>&1 | tail -n 300

  app-build:
    name: Build app + widget (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project InboxButler.xcodeproj \
            -scheme InboxButler \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -n 400
