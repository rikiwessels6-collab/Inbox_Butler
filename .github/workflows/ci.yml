# Builds and tests on a real Mac in the cloud. No signing, no secrets needed.
name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  core-tests:
    name: Core tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run InboxButlerCore tests
        working-directory: InboxButlerCore
        run: |
          swift test > ../core.log 2>&1 && status=0 || status=$?
          echo "---- errors ----"; grep -E "error:|failed|Fatal" ../core.log | sort -u | head -60
          echo "---- tail ----"; tail -n 25 ../core.log
          exit $status

  app-build:
    name: Build app + widget (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild build \
            -project InboxButler.xcodeproj \
            -scheme InboxButler \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 && status=0 || status=$?
          echo "---- errors ----"; grep -E "error:" build.log | sort -u | head -60
          echo "---- tail ----"; tail -n 15 build.log
          exit $status

  ui-smoke:
    name: Launch app in simulator and tap through
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Available simulators
        run: xcrun simctl list devices available | grep -E "iPhone" | head -5
      - name: UI smoke test
        run: |
          xcodebuild test \
            -project InboxButler.xcodeproj \
            -scheme InboxButler \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:InboxButlerUITests \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath ui.xcresult > ui.log 2>&1 && status=0 || status=$?
          echo "---- errors ----"; grep -E "error:|failed|Assertion" ui.log | sort -u | head -60
          echo "---- tests ----"; grep -E "Test Case.*(passed|failed)" ui.log | head -20
          echo "---- tail ----"; tail -n 15 ui.log
          exit $status
      - name: Keep test results if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: ui.xcresult

  basic-build:
    name: Basic TestFlight variant builds (no widget)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite project for the basic build
        run: |
          pip3 install --quiet pyyaml || pip3 install --quiet --break-system-packages pyyaml
          python3 scripts/make_basic_project.py
      - name: Generate and build
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild build \
            -project InboxButler.xcodeproj \
            -scheme InboxButler \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 && status=0 || status=$?
          echo "---- errors ----"; grep -E "error:" build.log | sort -u | head -40
          echo "---- tail ----"; tail -n 8 build.log
          exit $status
