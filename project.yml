# XcodeGen spec. Generate the Xcode project on a Mac with:
#   brew install xcodegen && xcodegen generate && open InboxButler.xcodeproj
# The generated .xcodeproj is not committed; this file is the source of truth.
#
# BEFORE FIRST BUILD, replace the placeholders:
#   DEVELOPMENT_TEAM          your 10-character Apple team id
#   com.boundarylineapps.InboxButler   your bundle id (widget id must be "<app id>.Widget")
#   group.com.boundarylineapps.InboxButler  your App Group id. Must ALSO match
#       WidgetSnapshotStore.appGroupID in InboxButlerCore/.../Widget/WidgetSnapshot.swift
name: InboxButler
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  InboxButlerCore:
    path: InboxButlerCore
targets:
  InboxButler:
    type: application
    platform: iOS
    sources: [InboxButler]
    dependencies:
      - package: InboxButlerCore
      - target: InboxButlerWidget      # embeds the widget extension
    entitlements:
      path: InboxButler/InboxButler.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.boundarylineapps.InboxButler
        # Lets priority notifications break through Focus modes.
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: InboxButler/Info.plist
      properties:
        CFBundleDisplayName: Inbox Butler
        NSFaceIDUsageDescription: Inbox Butler can ask for Face ID before opening, to keep your mail private.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad apps must declare all four orientations (App Store upload check).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Write-only: the app can add events you confirm but cannot read your calendar.
        NSCalendarsWriteOnlyAccessUsageDescription: >-
          Inbox Butler adds events found in your email to your calendar, only
          after you tap Add on each one. It cannot read your existing events.
        # App only uses OS-provided HTTPS/TLS, which is exempt. Confirm before
        # submitting to App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        # Periodic new-mail check (iOS decides timing, ~15+ min). Identifier must
        # match BackgroundRefresh.identifier and use your bundle id.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.boundarylineapps.InboxButler.refresh
    scheme:
      testTargets: [InboxButlerUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boundarylineapps.InboxButler
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  InboxButlerWidget:
    type: app-extension
    platform: iOS
    sources: [InboxButlerWidget]
    dependencies:
      - package: InboxButlerCore
    entitlements:
      path: InboxButlerWidget/InboxButlerWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.boundarylineapps.InboxButler
    info:
      path: InboxButlerWidget/Info.plist
      properties:
        CFBundleDisplayName: Inbox Butler
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boundarylineapps.InboxButler.Widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  InboxButlerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [InboxButlerUITests]
    dependencies:
      - target: InboxButler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boundarylineapps.InboxButler.UITests
        GENERATE_INFOPLIST_FILE: YES
